services:
  db:
    image: postgres:latest
    restart: always
    environment:
      POSTGRES_USER: news_user
      POSTGRES_PASSWORD: news
      POSTGRES_DB: News
    ports:
      - "5432:5432"

  news-app:
    env_file:
      - config.env
    build: .
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - db